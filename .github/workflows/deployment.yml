name: Deploy BathAtlas App to Server

on:
  workflow_dispatch:
    inputs:
      deployment_env:
        description: "Select environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: bathatlas-react

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_AUTH_TOKEN: ${{ secrets.VITE_API_AUTH_TOKEN }}

      - name: Resolve deployment path
        id: vars
        env:
          BASE_PATH: ${{ secrets.SERVER_DEPLOYMENT_PATH }}
          DEPLOYMENT_ENV: ${{ inputs.deployment_env }}
        run: |
          set -euo pipefail

          if [[ -z "$BASE_PATH" ]]; then
            echo "SERVER_DEPLOYMENT_PATH is not configured."
            exit 1
          fi

          # Remove trailing slashes
          while [[ "$BASE_PATH" == */ ]]; do
            BASE_PATH="${BASE_PATH%/}"
          done

          # Validate the base path
          if [[ -z "$BASE_PATH" || "$BASE_PATH" != /* ]]; then
            echo "Invalid SERVER_DEPLOYMENT_PATH."
            exit 1
          fi

          # Validate the deployment environment
          case "$DEPLOYMENT_ENV" in
            dev|prod) ;;
            *)
              echo "Invalid deployment environment."
              exit 1
              ;;
          esac

          echo "deploy_path=${BASE_PATH}/${DEPLOYMENT_ENV}" >> "$GITHUB_OUTPUT"

      - name: Prepare target directory
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            mkdir -p "${{ steps.vars.outputs.deploy_path }}"
            find "${{ steps.vars.outputs.deploy_path }}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Upload dist folder
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/*"
          target: "${{ steps.vars.outputs.deploy_path }}"
          strip_components: 1

      - name: Set permissions
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            chown -R appuser:www-data "${{ steps.vars.outputs.deploy_path }}"
            chmod -R 755 "${{ steps.vars.outputs.deploy_path }}"